<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IQ Puzzle - 999 ئاست</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="netCanvas"></canvas>
    <div id="app">
        <!-- سەرپەڕە -->
        <div id="homeScreen">
            <div class="logo">🧠</div>
            <h1>IQ PUZZLE</h1>
            <p>٩٩٩ ئاست بۆ تاقیکردنەوەی بیرەوەری!</p>
            <button onclick="startGame()">🔓 دەستپێبکە</button>
            <div class="stats">
                <span>🏆 ئاست: <b id="levelDisplay">١</b></span>
                <span>⭐ خاڵ: <b id="scoreDisplay">٠</b></span>
            </div>
        </div>

        <!-- دەرگای یاری -->
        <div id="gameScreen" style="display:none">
            <div class="header">
                <span>🏆 ئاست <b id="gameLevel">١</b>/٩٩٩</span>
                <span>⭐ <b id="gameScore">٠</b></span>
                <button onclick="goHome()" class="homeBtn">🏠</button>
            </div>
            <div class="puzzle-box">
                <div id="puzzleImage">🖼️</div>
                <h3 id="puzzleQuestion">پرسیار لێرە دەردەکەوێت</h3>
                <div id="puzzleContent"></div>
            </div>
            <div class="options" id="optionsContainer"></div>
            <div class="controls">
                <button onclick="hint()" class="hintBtn">💡 ئاماژە (<span id="hintCount">٣</span>)</button>
                <button onclick="checkAnswer()" class="submitBtn">✅ وەڵام بدە</button>
            </div>
            <div id="feedback"></div>
        </div>

        <!-- دەرگای کۆتایی -->
        <div id="endScreen" style="display:none">
            <div class="trophy">🏆</div>
            <h1>پیرۆز بێت! 🎉</h1>
            <p>تۆ هەموو ٩٩٩ ئاستت تەواو کرد!</p>
            <p>خاڵەکانت: <b id="finalScore">٠</b></p>
            <button onclick="resetGame()">🔄 دووبارە بکەوە</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
